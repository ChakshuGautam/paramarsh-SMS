name: Seeder Tests

on:
  push:
    paths:
      - 'apps/api/src/seed/**'
      - 'apps/api/prisma/**'
      - '.github/workflows/seeder-tests.yml'
  pull_request:
    paths:
      - 'apps/api/src/seed/**'
      - 'apps/api/prisma/**'
      - '.github/workflows/seeder-tests.yml'
  workflow_dispatch:

jobs:
  test-seeders:
    name: Run Seeder Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Setup test database
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run seeder tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          NODE_ENV: test
        run: |
          chmod +x scripts/test-seeders-ci.sh
          ./scripts/test-seeders-ci.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: seeder-test-results
          path: |
            apps/api/test-results/seeder-test-report.txt
            apps/api/test-results/seeder-test-report.json
            apps/api/test-results/*.log

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read the test report
            const reportPath = path.join('apps', 'api', 'test-results', 'seeder-test-report.json');
            
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const { summary } = report;
              
              const passRate = summary.totalTests > 0 
                ? Math.round((summary.passedTests / summary.totalTests) * 100) 
                : 0;
              
              const status = summary.failedFiles === 0 ? '✅' : '❌';
              
              const comment = `## ${status} Seeder Tests Results
              
              **File-Level Results:**
              - Total Files: ${summary.totalFiles}
              - ✅ Passed: ${summary.passedFiles}
              - ❌ Failed: ${summary.failedFiles}
              - ⚠️ Timeout: ${summary.timeoutFiles}
              
              **Test-Level Results:**
              - Total Tests: ${summary.totalTests}
              - ✅ Passed: ${summary.passedTests}
              - ❌ Failed: ${summary.failedTests}
              - Success Rate: ${passRate}%
              
              ${summary.failedFiles > 0 ? '⚠️ **Action Required:** Please fix the failing tests before merging.' : '✨ All tests passed successfully!'}`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Check test results
        working-directory: apps/api
        run: |
          if [ -f test-results/seeder-test-report.json ]; then
            failed=$(cat test-results/seeder-test-report.json | grep '"failedFiles":' | grep -oE '[0-9]+')
            if [ "$failed" -gt "0" ]; then
              echo "❌ $failed test files failed"
              exit 1
            else
              echo "✅ All tests passed"
            fi
          else
            echo "❌ Test report not found"
            exit 1
          fi